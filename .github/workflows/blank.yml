--==================================================
-- APENAS SPAWNS DO SERVER SECRET
--==================================================

local Seen = {}

local function IsServerSecretObject(obj)

    local current = obj

    while current and current ~= workspace do

        local name = string.lower(current.Name)

        if name == "server secret"
        or name == "serversecret"
        or name == "server_secret" then
            return true
        end

        current = current.Parent
    end

    return false
end

local function AddSpawn(obj)

    if Seen[obj] then
        return
    end

    if not IsServerSecretObject(obj) then
        return
    end

    if not (obj:IsA("Model") or obj:IsA("BasePart")) then
        return
    end

    Seen[obj] = true

    local Row = Instance.new("Frame")
    Row.Size = UDim2.new(1,-8,0,32)
    Row.BackgroundColor3 = Color3.fromRGB(25,25,32)
    Row.BorderSizePixel = 0
    Row.Parent = List

    local RowCorner = Instance.new("UICorner")
    RowCorner.CornerRadius = UDim.new(0,6)
    RowCorner.Parent = Row

    local Name = Instance.new("TextLabel")
    Name.Size = UDim2.new(1,-16,1,0)
    Name.Position = UDim2.fromOffset(8,0)
    Name.BackgroundTransparency = 1
    Name.Text = obj.Name
    Name.TextColor3 = Color3.fromRGB(235,235,240)
    Name.Font = Enum.Font.GothamMedium
    Name.TextSize = 11
    Name.TextXAlignment = Enum.TextXAlignment.Left
    Name.TextTruncate = Enum.TextTruncate.AtEnd
    Name.Parent = Row

    Status.Text = "Server Secret: " .. tostring(#List:GetChildren()-1) .. " spawn(s)"

    task.defer(function()
        List.CanvasSize = UDim2.new(
            0,
            0,
            0,
            Layout.AbsoluteContentSize.Y + 8
        )
    end)
end

-- verifica o que já existe
for _, obj in ipairs(workspace:GetDescendants()) do
    AddSpawn(obj)
end

-- detecta novos spawns
workspace.DescendantAdded:Connect(function(obj)

    task.wait(0.1)

    AddSpawn(obj)
end)

--==================================================
-- RESPONSIVE
--==================================================

local Scale = Instance.new("UIScale")
Scale.Parent = Main

local function UpdateScale()

    local Camera = workspace.CurrentCamera

    if not Camera then
        return
    end

    local View = Camera.ViewportSize

    local sx = (View.X - 20) / 340
    local sy = (View.Y - 20) / 380

    Scale.Scale = math.clamp(
        math.min(sx,sy),
        0.65,
        1
    )
end

UpdateScale()

workspace:GetPropertyChangedSignal("CurrentCamera"):Connect(UpdateScale)

if workspace.CurrentCamera then
    workspace.CurrentCamera:GetPropertyChangedSignal(
        "ViewportSize"
    ):Connect(UpdateScale)
end
