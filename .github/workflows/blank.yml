--==================================================
-- BUTTON CREATOR
--==================================================

local function CreateButton(text, position)
    local Button = Instance.new("TextButton")

    Button.Size = UDim2.fromOffset(210, 48)
    Button.Position = position
    Button.BackgroundColor3 = Color3.fromRGB(88, 32, 145)
    Button.BorderSizePixel = 0
    Button.AutoButtonColor = false
    Button.Text = text
    Button.TextColor3 = Color3.fromRGB(255, 255, 255)
    Button.Font = Enum.Font.GothamBold
    Button.TextSize = 13
    Button.Parent = Main

    local Corner = Instance.new("UICorner")
    Corner.CornerRadius = UDim.new(0, 9)
    Corner.Parent = Button

    local Stroke = Instance.new("UIStroke")
    Stroke.Color = Color3.fromRGB(180, 80, 255)
    Stroke.Transparency = 0.35
    Stroke.Parent = Button

    Button.MouseEnter:Connect(function()
        TweenService:Create(
            Button,
            TweenInfo.new(0.15),
            {
                BackgroundColor3 =
                    Color3.fromRGB(125, 43, 195)
            }
        ):Play()
    end)

    Button.MouseLeave:Connect(function()
        TweenService:Create(
            Button,
            TweenInfo.new(0.15),
            {
                BackgroundColor3 =
                    Color3.fromRGB(88, 32, 145)
            }
        ):Play()
    end)

    return Button
end

local AutoRiddleButton = CreateButton(
    "AUTO RIDDLE  •  OFF",
    UDim2.fromOffset(20, 108)
)

local InstantRedeemButton = CreateButton(
    "INSTANT REDEEM  •  OFF",
    UDim2.fromOffset(240, 108)
)

local function UpdateButton(Button, name, state)
    Button.Text =
        name .. "  •  " .. (state and "ON" or "OFF")

    Button.BackgroundColor3 =
        state
        and Color3.fromRGB(35, 125, 75)
        or Color3.fromRGB(88, 32, 145)
end

AutoRiddleButton.MouseButton1Click:Connect(function()
    Config.AutoRiddle = not Config.AutoRiddle

    UpdateButton(
        AutoRiddleButton,
        "AUTO RIDDLE",
        Config.AutoRiddle
    )

    SetStatus(
        Config.AutoRiddle
        and "Riddle solver enabled"
        or "Riddle solver disabled"
    )

    SaveConfig()
end)

InstantRedeemButton.MouseButton1Click:Connect(function()
    Config.InstantRedeem = not Config.InstantRedeem

    UpdateButton(
        InstantRedeemButton,
        "INSTANT REDEEM",
        Config.InstantRedeem
    )

    SetStatus(
        Config.InstantRedeem
        and "Redeem system enabled"
        or "Redeem system disabled"
    )

    SaveConfig()
end)

